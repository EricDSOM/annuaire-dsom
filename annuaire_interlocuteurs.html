<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Annuaire des interlocuteurs</title>
<style>
:root{--blue:#173A63;--blue2:#23588F;--orange:#F28C28;--bg:#F5F7FA;--text:#16202A;--muted:#667085;--border:#E4E7EC}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1050px;margin:0 auto;padding:34px 18px 50px}
.hero{background:linear-gradient(110deg,var(--blue),var(--blue2));border-radius:18px;padding:28px 28px 24px;color:white;box-shadow:0 12px 30px rgba(23,58,99,.15)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#ffd2a8}
h1{margin:6px 0 8px;font-size:30px}
.hero p{margin:0 0 22px;color:#e7edf5}
.searchbox{display:flex;gap:10px;background:white;padding:8px;border-radius:12px}
.searchbox input{flex:1;border:0;outline:0;padding:13px 14px;font-size:16px;border-radius:8px;color:var(--text)}
.searchbox button{border:0;background:var(--orange);color:white;padding:0 18px;border-radius:8px;font-weight:700;cursor:pointer}
.meta{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:22px 2px 12px;color:var(--muted);font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.pill{border:1px solid var(--border);background:white;border-radius:999px;padding:7px 11px;font-size:13px;cursor:pointer;color:#344054}
.pill:hover{border-color:#b9c4d0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}
.card{background:white;border:1px solid var(--border);border-radius:14px;padding:17px;box-shadow:0 3px 10px rgba(16,24,40,.04)}
.company{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--orange);text-transform:uppercase;margin-bottom:9px}
.name{font-size:18px;font-weight:800;margin-bottom:8px;color:var(--blue)}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.role{display:inline-block;background:#eef4fa;color:#294f77;border-radius:999px;padding:5px 9px;font-size:12px;line-height:1.25}
.contact{display:flex;flex-direction:column;gap:7px;font-size:14px}
.contact a{color:#245b92;text-decoration:none;word-break:break-word}
.contact a:hover{text-decoration:underline}
.empty{grid-column:1/-1;background:white;border:1px dashed #cfd6df;border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.count strong{color:var(--blue)}
@media(max-width:600px){h1{font-size:24px}.hero{padding:22px 18px}.searchbox{display:block}.searchbox button{width:100%;height:42px;margin-top:7px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<div class="eyebrow">Annuaire partenaires</div>
<h1>Nos interlocuteurs</h1>
<p>Recherchez par compagnie, nom, prénom ou rôle.</p>
<div class="searchbox">
<input id="q" type="search" placeholder="Ex. AIG, Sylvie, souscripteur, RC Pro…" autocomplete="off">
<button id="clearBtn" type="button">Effacer</button>
</div>
</section>

<div class="meta">
<div class="count" id="count"></div>
<div>Recherche instantanée</div>
</div>

<div class="pills" id="pills"></div>
<div class="grid" id="results"></div>
</div>

const q=document.getElementById('q'),
      results=document.getElementById('results'),
      count=document.getElementById('count'),
      pills=document.getElementById('pills');

function norm(s){
  return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()
}
function esc(s){
  return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))
}
function telHref(s){
  return 'tel:'+(s||'').replace(/[^+\d]/g,'')
}
function searchable(x){
  return norm([x.compagnie,x.nom,...x.roles].join(' '))
}
function render(){
  const query=norm(q.value);
  const filtered=query ? DATA.filter(x=>searchable(x).includes(query)) : [];

  count.innerHTML=query
    ? `<strong>${filtered.length}</strong> contact${filtered.length>1?'s':''} trouvé${filtered.length>1?'s':''}`
    : `Recherchez une compagnie, un nom, un prénom ou un rôle`;

  if(!query){
    results.innerHTML=`<div class="empty">Saisissez votre recherche pour afficher les interlocuteurs correspondants.</div>`;
    return;
  }

  if(!filtered.length){
    results.innerHTML=`<div class="empty">Aucun interlocuteur trouvé pour « ${esc(q.value)} ».</div>`;
    return;
  }

  results.innerHTML=filtered.map(x=>{
    const label=x.nom||(x.roles[0]||'Contact / Service');
    const roles=x.roles.length
      ? `<div class="roles">${x.roles.map(r=>`<span class="role">${esc(r)}</span>`).join('')}</div>`
      : '';

    const details=[
      x.mail?`<a href="mailto:${esc(x.mail)}">✉ ${esc(x.mail)}</a>`:'',
      x.tel?`<a href="${telHref(x.tel)}">☎ ${esc(x.tel)}</a>`:'',
      x.portable?`<a href="${telHref(x.portable)}">📱 ${esc(x.portable)}</a>`:''
    ].filter(Boolean).join('');

    return `<article class="card">
      <div class="company">${esc(x.compagnie)}</div>
      <div class="name">${esc(label)}</div>
      ${roles}
      <div class="contact">${details}</div>
    </article>`;
  }).join('');
}

const companies=[...new Set(DATA.map(x=>x.compagnie).filter(Boolean))]
  .sort((a,b)=>a.localeCompare(b,'fr'));

pills.innerHTML=companies
  .map(c=>`<button class="pill" type="button" data-company="${esc(c)}">${esc(c)}</button>`)
  .join('');

pills.addEventListener('click',e=>{
  if(e.target.classList.contains('pill')){
    q.value=e.target.dataset.company;
    render();
    q.focus();
  }
});

q.addEventListener('input',render);

document.getElementById('clearBtn').addEventListener('click',()=>{
  q.value='';
  render();
  q.focus();
});

render();
</script>
